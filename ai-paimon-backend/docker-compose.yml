version: '3.8'

services:
  # AI Paimon Backend API服务
  ai-paimon-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - FEATURES__KB__ENABLED=false
      - FEATURES__VISEME__RHUBARB=false
      - FEATURES__AVATAR__MODE=live2d
    volumes:
      # 开发模式下挂载源码，支持热重载
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-paimon-api
    restart: unless-stopped
    profiles:
      - "with-nginx"

  # Redis缓存（可选，用于会话管理）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - "with-redis"

  # PostgreSQL数据库（可选，用于知识库存储）
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paimon_kb
      POSTGRES_USER: paimon
      POSTGRES_PASSWORD: paimon_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped
    profiles:
      - "with-db"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: paimon-network